<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11100f"><title>RockGod® | Build Engine Alpha</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#f4f0e9;background:#11100f;font-synthesis:none}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#28231d,#11100f 60%);min-height:100vh}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #e7bd76;outline-offset:3px}.wrap{max-width:1080px;margin:auto;padding:20px 16px 55px}.header{display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid #4d4336;padding-bottom:18px}.brand{font-weight:1000;font-style:italic;font-size:clamp(27px,6vw,48px);letter-spacing:-3px;color:#dcb87c;transform:skew(-9deg)}.brand small{font-style:normal;letter-spacing:2px;font-size:10px;display:block;color:#ddd;font-weight:400;transform:skew(9deg)}.alpha{font-size:11px;letter-spacing:2px;border:1px solid #746143;color:#dcb87c;padding:8px}.progress{display:flex;gap:6px;max-width:370px;margin:24px auto 8px}.progress i{flex:1;height:5px;border-radius:9px;background:#484747}.progress i.on{background:#e2ba7a;box-shadow:0 0 9px #aa8245}.step{text-align:center;color:#c5b090;letter-spacing:4px;font-size:11px}.eyebrow{text-align:center;color:#d8b47b;letter-spacing:5px;font-size:12px;margin-top:30px}h1{text-align:center;font-size:clamp(31px,7vw,67px);letter-spacing:-1px;margin:14px 0 8px;line-height:1.03;text-transform:uppercase}h1 em{font-style:normal;color:#dfb879}.intro{text-align:center;color:#ddd;line-height:1.5;margin:0 auto 24px;max-width:650px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-top:25px}.choice{background:#181716;color:#eee;border:1px solid #5a5550;border-radius:5px;overflow:hidden;padding:0 0 17px;min-width:0;transition:border-color .15s,transform .15s}.choice:hover{border-color:#b99a68}.choice.selected{border:2px solid #edc78b;box-shadow:0 0 18px #d4a05b33}.choice img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top}.choice strong{display:block;letter-spacing:2px;font-size:clamp(11px,1.8vw,19px);margin:12px 3px 3px}.choice span{font-size:12px;color:#c8c0b5}.choice.selected strong:after{content:' ✓';color:#eac588}.nav{display:flex;justify-content:space-between;gap:12px;margin:30px 0}.btn{padding:17px 22px;border:1px solid #645b50;background:transparent;color:#fff;letter-spacing:2px;font-weight:700;text-transform:uppercase;border-radius:4px}.btn.gold{background:linear-gradient(130deg,#f0ce92,#c39752);color:#16110a;border-color:#e7c187}.btn:disabled{opacity:.3;cursor:not-allowed}.foot{text-align:center;color:#8f8981;letter-spacing:3px;font-size:10px;border-top:1px solid #38332d;padding-top:22px}.panel{border:1px solid #625747;background:#1b1917;border-radius:8px;padding:20px;margin:20px auto;max-width:770px}.panel h2{color:#e9c187;text-transform:uppercase}.panel p{line-height:1.55;color:#d4cdc3}.summary{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:12px;align-items:center}.summary img{width:100%;border-radius:5px}.summary .side{border:1px solid #544b40;padding:10px;text-align:center}.side img{aspect-ratio:1;object-fit:cover}.side strong{display:block;padding:8px}.side button{background:none;color:#eac48a;border:1px solid #77654a;padding:9px;width:100%}.tag{display:inline-block;border:1px solid #90754d;color:#eac48a;padding:7px 10px;font-size:12px;letter-spacing:1px}.nemesis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.nemesis button{min-height:85px;background:#24211e;color:#eee;border:1px solid #62584d;border-radius:5px;padding:12px}.nemesis button.selected{border:2px solid #eac48a;background:#443525}.warning{font-size:13px;color:#c9bda9;text-align:center}.hidden{display:none}.cta{display:block;text-align:center;margin:14px auto}.small{font-size:12px;color:#b6a994}.route{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}.route button{min-width:200px}.review{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.review div{background:#24201c;padding:14px;border:1px solid #5a5045}.review strong{color:#e9c187} @media(max-width:640px){.wrap{padding:13px 12px 36px}.header{padding-bottom:12px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choice img{aspect-ratio:3/3.7}.choice strong{font-size:12px;letter-spacing:1px}.choice span{font-size:10px}.nav .btn{font-size:12px;padding:15px 12px}.summary{grid-template-columns:1fr 1fr}.summary .main{grid-column:1/-1;grid-row:1;max-width:310px;margin:auto}.nemesis{grid-template-columns:repeat(2,1fr)}.review{grid-template-columns:1fr}h1{font-size:36px}.eyebrow{letter-spacing:3px}}
</style></head><body><main class="wrap"><header class="header"><div class="brand">RockGod®<small>YOUR LOOK. YOUR BUILD.</small></div><div class="alpha">ALPHA · DEMO ONLY</div></header><div id="progress" class="progress"></div><div id="step" class="step"></div><section id="content" aria-live="polite"></section><footer class="foot">EVERY LOOK HAS A STORY · ROCKGOD® PROTOTYPE · NO PURCHASES OR DATA COLLECTION</footer></main><script>
const hair=['BALD / SHAVED','SHORT','MEDIUM','LONG'],beard=['CLEAN SHAVEN','STUBBLE','SHORT','LONG'];const state={stage:0,mode:null,currentHair:null,currentBeard:null,targetHair:null,targetBeard:null,nemesis:[]};let editReturn=null;const $=s=>document.querySelector(s);const asset=(type,i)=>`assets/${type}-${i}.webp`;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function header(label,title,desc){return `<div class="eyebrow">${label}</div><h1>${title}</h1><p class="intro">${desc}</p>`}function cards(type,key){let opts=type==='hair'?hair:beard;return `<div class="cards">${opts.map((v,i)=>`<button class="choice ${state[key]===i?'selected':''}" data-key="${key}" data-val="${i}" aria-pressed="${state[key]===i}"><img src="${asset(type,i)}" alt="${v.toLowerCase()} ${type} reference"/><strong>${v}</strong><span>${state[key]===i?'SELECTED':'TAP TO SELECT'}</span></button>`).join('')}</div>`}function nav(back='BACK',next='CONTINUE',disabled=false){return `<div class="nav"><button class="btn" id="back">← ${back}</button><button class="btn gold" id="next" ${disabled?'disabled':''}>${next} →</button></div>`}function render(){const s=state.stage;$('#progress').innerHTML=Array.from({length:6},(_,i)=>`<i class="${i<=Math.max(0,s-1)?'on':''}"></i>`).join('');$('#step').textContent=s===0?'WELCOME':`STEP ${Math.min(s,6)} OF 6`;let html='';if(s===0){html=header('THE BUILD ENGINE','YOUR LOOK. <em>YOUR BUILD.</em>','Choose where you are, decide where you want to go, and discover a practical grooming routine.');html+=`<div class="panel" style="text-align:center"><span class="tag">VISUAL CHARACTER BUILDER</span><h2>No single RockGod look.</h2><p>Keep the look you love or work towards something different. Your choice.</p><div class="route"><button class="btn gold" data-mode="change">LOOKING TO CHANGE →</button><button class="btn" data-mode="keep">HAPPY WHERE I AM →</button></div><p class="small">Prototype only. No email, payment or account required.</p></div>`}if(s===1){html=header('YOUR HAIR BUILD','WHERE ARE YOU <em>NOW?</em>','Choose the hair that looks most like yours right now. Just pick the closest.');html+=cards('hair','currentHair')+nav('START','CONTINUE',state.currentHair===null)}if(s===2){html=header('YOUR BEARD BUILD','YOUR BEARD <em>NOW?</em>','Choose the beard that looks most like yours right now.');html+=cards('beard','currentBeard')+nav('BACK','CONTINUE',state.currentBeard===null)}if(s===3){html=header('YOUR TARGET BUILD','WHERE WOULD YOU <em>LIKE TO GO?</em>','Choose your target hair and beard. Keeping your current look is a valid choice.');html+=`<div class="panel"><h2>Target hair</h2>${cards('hair','targetHair')}<h2>Target beard</h2>${cards('beard','targetBeard')}</div>`+nav('BACK','SEE MY BUILD',state.targetHair===null||state.targetBeard===null)}if(s===4){let h=state.targetHair,b=state.targetBeard;html=header('YOUR FINAL BUILD','THIS IS <em>YOUR BUILD.</em>','Your selected look, ready to refine. The central portrait is an illustrative placeholder, not a generated combination.');html+=`<div class="summary"><div class="side"><img src="${asset('hair',h)}" alt="Chosen hair"/><strong>HAIR: ${hair[h]}</strong><button data-edit="hair">✎ CHANGE</button></div><img class="main" src="assets/final-example.webp" alt="Illustrative grayscale final build; not yet customised to selections"/><div class="side"><img src="${asset('beard',b)}" alt="Chosen beard"/><strong>BEARD: ${beard[b]}</strong><button data-edit="beard">✎ CHANGE</button></div></div><p class="warning">The two selection cards are accurate. A dynamically combined portrait is planned for the next version.</p>`+nav('BACK','MEET MY NEMESIS')}if(s===5){let problems=['FRIZZ & FLYAWAYS','DRYNESS','LACK OF VOLUME','DIFFICULT TO STYLE','DOESN’T HOLD SHAPE','UNSURE WHAT TO USE','BEARD FEELS ROUGH','NOT ENOUGH TIME','NOTHING — MAINTENANCE'];html=header('YOUR NEMESIS','WHAT DO YOU WANT <em>HELP WITH?</em>','Pick what you want your routine to address. Choose up to two, or select maintenance.');html+=`<div class="nemesis">${problems.map((p,i)=>`<button data-nemesis="${i}" class="${state.nemesis.includes(i)?'selected':''}" aria-pressed="${state.nemesis.includes(i)}">${p}${state.nemesis.includes(i)?' ✓':''}</button>`).join('')}</div>`+nav('BACK','VIEW MY LOADOUT',!state.nemesis.length)}if(s===6){let names=['Frizz & flyaways','Dryness','Lack of volume','Difficult styling','Hold','Product guidance','Beard roughness','Time','Maintenance'];html=header('YOUR LOADOUT','YOUR PERSONALISED <em>ROUTINE.</em>','A preview of your Quest. Product suitability, pricing and tutorials are still being developed.');html+=`<div class="panel"><span class="tag">DEMO · NO PRODUCTS FOR SALE</span><h2>Your Build</h2><div class="review"><div><strong>Hair</strong><p>${hair[state.currentHair]} → ${hair[state.targetHair]}</p></div><div><strong>Beard</strong><p>${beard[state.currentBeard]} → ${beard[state.targetBeard]}</p></div></div><h2>Your focus</h2><p>${state.nemesis.map(n=>names[n]).join(' · ')}</p><h2>Next: equip your Loadout</h2><p>We will connect tested products to your goals, explain why each is suitable, and add short tutorials. No products are recommended or sold in this prototype.</p></div>`+`<div class="nav"><button class="btn" id="back">← BACK</button><button class="btn gold" id="restart">START AGAIN ↻</button></div>`}$('#content').innerHTML=html;document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{state[b.dataset.key]=Number(b.dataset.val);render()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;state.stage=1;render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editReturn=4;state.stage=b.dataset.edit==='hair'?3:3;render()});document.querySelectorAll('[data-nemesis]').forEach(b=>b.onclick=()=>{let n=Number(b.dataset.nemesis);if(n===8){state.nemesis=state.nemesis.includes(8)?[]:[8]}else{state.nemesis=state.nemesis.filter(v=>v!==8);if(state.nemesis.includes(n))state.nemesis=state.nemesis.filter(v=>v!==n);else if(state.nemesis.length<2)state.nemesis.push(n)}render()});if($('#back'))$('#back').onclick=()=>{if(editReturn!==null&&s===3){state.stage=editReturn;editReturn=null}else state.stage=Math.max(0,s-1);render()};if($('#next'))$('#next').onclick=()=>{if(s===2&&state.mode==='keep'){state.targetHair=state.currentHair;state.targetBeard=state.currentBeard;state.stage=4}else{state.stage=s+1}editReturn=null;render()};if($('#restart'))$('#restart').onclick=()=>{state.stage=0;state.mode=null;state.currentHair=state.currentBeard=state.targetHair=state.targetBeard=null;state.nemesis=[];render()};window.scrollTo({top:0,behavior:'instant'})}render();
</script></body></html>
