<body>
<main class="wrap">
<header class="header"><div class="brand">RockGod®<small>BUILD THE LOOK · EQUIP THE ROUTINE</small></div><div class="alpha">ALPHA V0.4.1.2 · DEMO</div></header>
<section id="content" aria-live="polite"></section>
<footer class="foot">ROCKGOD® PROTOTYPE · NO PURCHASES OR DATA COLLECTION · PRICING AND PRODUCT ROLES ARE TEST HYPOTHESES</footer>
</main>
<div class="bottomnav" id="bottomnav"><div class="bottom-inner"><button class="btn" id="back">← BACK</button><div class="progress-wrap"><div id="step" class="step"></div><div id="progress" class="progress"></div></div><button class="btn gold" id="next">CONTINUE →</button></div></div>
<script>
const hair=['BALD / SHAVED','SHORT','MEDIUM','LONG'];
const beard=['CLEAN SHAVEN','STUBBLE','SHORT','LONG'];
const problemLabels=['Hair looks messy or fluffy','Hair feels dry or rough','Hair looks flat','Hair is hard to style','Style doesn’t stay in place','Beard feels dry or rough','Maintenance only'];
const problems=['HAIR LOOKS MESSY OR FLUFFY','HAIR FEELS DRY OR ROUGH','HAIR LOOKS FLAT','HAIR IS HARD TO STYLE','STYLE DOESN’T STAY IN PLACE','BEARD FEELS DRY OR ROUGH','NOTHING — JUST MAINTENANCE'];
const barrierLabels=['I don’t know what products to use','I don’t know the technique','I’ve tried things and they haven’t worked','I don’t want a complicated routine','I don’t want to spend ages doing it','I’m not sure what actually suits me'];
const state={stage:0,mode:null,currentHair:null,currentBeard:null,targetHair:null,targetBeard:null,nemesis:[],barriers:[]};
const $=s=>document.querySelector(s); const asset=(type,i)=>`assets/${type}-${i}.webp`; const finalAsset=(h,b)=>`assets/final-${h}-${b}.webp`;
function header(label,title,desc){return `<div class="eyebrow">${label}</div><h1>${title}</h1><p class="intro">${desc}</p>`}
function cards(type,key){const opts=type==='hair'?hair:beard;return `<div class="cards">${opts.map((v,i)=>`<button class="choice ${type} ${state[key]===i?'selected':''}" data-key="${key}" data-val="${i}" aria-pressed="${state[key]===i}"><img src="${asset(type,i)}" alt="${v.toLowerCase()} ${type} reference"><strong>${v}</strong><span>${state[key]===i?'SELECTED':'TAP TO SELECT'}</span></button>`).join('')}</div>`}
function setStage(n){state.stage=n;render(false)}
function selectAndStay(key,val){state[key]=val;render(true)}
function toggleArray(key,val,max){let a=state[key];if(a.includes(val))a=a.filter(v=>v!==val);else if(a.length<max)a=[...a,val];state[key]=a;render(true)}
function suggestedProducts(){const picks=[]; const add=(name,type,why)=>{if(!picks.some(p=>p.type===type))picks.push({name,type,why})};
 if(state.nemesis.includes(2))add('AMP','Volume & Texture Spray','Adds lift and texture when hair looks flat.');
 if(state.nemesis.includes(1))add('RIFT','Conditioner','Supports softness and manageability when hair feels dry or rough.');
 if(state.nemesis.includes(5))add('BEARDFORGE','Beard Oil','Helps soften and condition coarse-feeling facial hair.');
 if(state.nemesis.includes(0))add('CONTROL','Leave-In Conditioner','Adds lightweight control when hair feels messy or fluffy.');
 if(state.nemesis.includes(3)||state.nemesis.includes(4))add('HOLDFAST','Matte Clay','Adds shape and hold without turning the routine into a project.');
 if(state.nemesis.includes(6))add('RESET','Daily Shampoo','A simple base product for an easy maintenance routine.');
 if(!picks.length)add('RESET','Daily Shampoo','A simple base product for your routine.');
 if(picks.length<2)add('RIFT','Conditioner','Adds a practical conditioning step to support your target Build.');
 return picks.slice(0,3)
}
function updateNav(){const nav=$('#bottomnav'),back=$('#back'),next=$('#next');if(state.stage===0){nav.classList.add('hidden');return}nav.classList.remove('hidden');const total=7;$('#step').textContent=state.stage<=7?`STEP ${state.stage} OF ${total}`:'BUILD COMPLETE';$('#progress').innerHTML=Array.from({length:total},(_,i)=>`<i class="${i<Math.min(state.stage,total)?'on':''}"></i>`).join('');back.textContent='← BACK';back.style.visibility='visible';next.style.visibility='visible';next.className='btn gold';next.disabled=false;
 const disabled=(state.stage===1&&state.currentHair===null)||(state.stage===2&&state.currentBeard===null)||(state.stage===3&&(state.targetHair===null||state.targetBeard===null))||(state.stage===5&&!state.nemesis.length)||(state.stage===6&&!state.barriers.length); next.disabled=disabled;
 if(state.stage===3)next.textContent='SEE MY BUILD →'; else if(state.stage===4)next.textContent='MEET MY NEMESIS →'; else if(state.stage===5)next.textContent='CONTINUE →'; else if(state.stage===6)next.textContent='VIEW MY LOADOUT →'; else if(state.stage===7)next.textContent='FIRST LOADOUT →'; else if(state.stage===8){back.textContent='← LOADOUT'; next.textContent='BUY NOW · £9.95';} else next.textContent='CONTINUE →';
}
function render(preserve=false){const y=window.scrollY,s=state.stage;let html='';
 if(s===0){html=header('CHARACTER BUILDER · HAIR + BEARD','BUILD THE LOOK YOU <em>WANT.</em>','Start with the hair and beard you have now. Then create the Build you want and we’ll show you what could help you get there.');html+=`<div class="panel quest" style="text-align:center"><span class="tag">YOUR BUILD STARTS HERE</span><h2>Choose your route</h2><p>You can improve the Build you already have or work towards something different.</p><div class="route"><button class="btn gold" data-mode="change"><span>LOOKING TO CHANGE</span><span>→</span></button><button class="btn alt" data-mode="keep"><span>HAPPY WHERE I AM</span><span>→</span></button></div><p class="small">Visual prototype. No account, email or payment required.</p></div>`}
 if(s===1){html=header('CURRENT BUILD · HAIR','WHERE ARE YOU <em>NOW?</em>','Choose the hair that looks most like yours right now. Pick the closest.');html+=cards('hair','currentHair')}
 if(s===2){html=header('CURRENT BUILD · BEARD','WHAT’S YOUR <em>BEARD?</em>','Choose the beard that looks most like yours right now.');html+=cards('beard','currentBeard')}
 if(s===3){html=header('TARGET BUILD','WHERE WOULD YOU <em>LIKE TO GO?</em>','Choose the hair and beard you want to build towards. Keeping either exactly as it is is a valid choice.');html+=`<div class="panel quest"><div class="target-section"><div class="target-heading"><h2>TARGET HAIR</h2><p>What would you like your hair to look like?</p></div>${cards('hair','targetHair')}</div><div class="target-section"><div class="target-heading"><h2>TARGET BEARD</h2><p>What would you like your beard to look like?</p></div>${cards('beard','targetBeard')}</div></div>`}
 if(s===4){const h=state.targetHair,b=state.targetBeard;html=header('FINAL BUILD','THIS IS <em>YOUR BUILD.</em>','This is the look you’re working towards.');html+=`<div class="summary"><div class="side"><img src="${asset('hair',h)}" alt="Chosen target hair"><strong>HAIR: ${hair[h]}</strong></div><img class="main" src="${finalAsset(h,b)}" alt="Illustrative grayscale final build portrait"><div class="side"><img class="beard-ref" src="${asset('beard',b)}" alt="Chosen target beard"><strong>BEARD: ${beard[b]}</strong></div></div><p class="warning">V0.4.1.2 preview: your selected hair + beard now loads from a 16-combination Final Build matrix and carries through the rest of the journey.</p>`}
 if(s===5){html=header('MEET YOUR NEMESIS','WHAT’S GETTING IN <em>THE WAY?</em>','You’ve chosen the Build you want. Your Nemesis is the practical thing making it harder to get there. Pick up to two.');html+=`<div class="nemesis">${problems.map((p,i)=>`<button data-nemesis="${i}" class="${state.nemesis.includes(i)?'selected':''}">${p}${state.nemesis.includes(i)?' ✓':''}</button>`).join('')}</div><p class="warning">Your Target Build + your Nemesis helps RockGod decide what belongs in your Loadout.</p>`}
 if(s===6){html=header('YOUR QUEST','WHAT’S BEEN <em>HOLDING YOU BACK?</em>','Two people can want the same Build and need completely different help. Choose up to two reasons that sound most like you.');html+=`<div class="barriers">${barrierLabels.map((p,i)=>`<button data-barrier="${i}" class="${state.barriers.includes(i)?'selected':''}">${p}${state.barriers.includes(i)?' ✓':''}</button>`).join('')}</div><p class="warning">We only ask this so the recommendation can include the right mix of product, technique and simplicity.</p>`}
 if(s===7){const picks=suggestedProducts();html=header('YOUR LOADOUT','BUILT FOR <em>YOUR QUEST.</em>','Your recommendation connects the Build you want with what’s getting in the way and why you haven’t solved it yet.');html+=`<div class="panel quest"><div class="summary" style="margin-bottom:14px"><div class="side"><img src="${asset('hair',state.targetHair)}" alt="Target hair"><strong>${hair[state.targetHair]}</strong></div><img class="main" src="${finalAsset(state.targetHair,state.targetBeard)}" alt="Illustrative final Build portrait"><div class="side"><img class="beard-ref" src="${asset('beard',state.targetBeard)}" alt="Target beard"><strong>${beard[state.targetBeard]}</strong></div></div><div class="review"><div><strong>Current → Target</strong><p>${hair[state.currentHair]} → ${hair[state.targetHair]}<br>${beard[state.currentBeard]} → ${beard[state.targetBeard]}</p></div><div><strong>Your Quest</strong><p>${state.nemesis.map(n=>problemLabels[n]).join(' · ')}</p></div><div><strong>What’s holding you back</strong><p>${state.barriers.map(i=>barrierLabels[i]).join(' · ')}</p></div><div><strong>RockGod response</strong><p>Products + quick technique + a routine designed to stay simple.</p></div></div><h2>Your recommended Loadout</h2><div class="loadout-grid">${picks.map((p,i)=>`<div class="product"><div class="slot">LOADOUT SLOT ${i+1}</div><h3>${p.name}</h3><p>${p.type}</p><p class="why"><strong>Why it’s here:</strong> ${p.why}</p><p class="small">Working product name / role for Alpha testing.</p></div>`).join('')}</div><p class="cta-note">Next step: try the Loadout in sample sizes before committing to full-size products.</p></div>`}
 if(s===8){const picks=suggestedProducts();html=`<div class="completion-mark">✦</div>`+header('BUILD COMPLETE','YOUR FIRST BUILD IS <em>READY.</em>','You’ve chosen the look, identified what’s getting in the way and built your first RockGod Loadout.');html+=`<div class="offer"><span class="tag">FOUNDING ALPHA OFFER · TEST CONCEPT</span><div class="offer-build"><img src="${finalAsset(state.targetHair,state.targetBeard)}" alt="Your selected Final Build"><span>YOUR BUILD · ${hair[state.targetHair]} HAIR + ${beard[state.targetBeard]} BEARD</span></div><h2>TRY YOUR FIRST LOADOUT</h2><div class="offer-price"><span class="was-price">£24.95</span><span class="now-price">£9.95</span></div><span class="saving">FOUNDING OFFER · SAVE £15</span><p>Start the journey with sample-size versions of the products selected for your Build.</p><div class="trust-strip"><div class="trust-item">Matched to your Build</div><div class="trust-item">Sample-size starter kit</div><div class="trust-item">Quick-use guide</div><div class="trust-item">Simple routine</div></div><ul>${picks.map(p=>`<li><strong>${p.name}</strong> — ${p.type}</li>`).join('')}<li>Simple “equip” instructions</li><li>Quick-use tutorial concept</li></ul><p class="prototype-note">Prototype pricing only: £24.95 is an illustrative reference price, not an established selling price. Final contents, postage and unit economics are not yet confirmed.</p><button class="btn gold" id="buydemo">GET MY FIRST LOADOUT · £9.95 →</button><div class="wallets"><button class="wallet dark" data-wallet="Apple Pay"> Pay · DEMO</button><button class="wallet" data-wallet="Google Pay">G Pay · DEMO</button><button class="wallet" data-wallet="Card">CARD · DEMO</button></div><p id="buymsg" class="warning hidden">Demo complete — this Alpha does not take payment. The live store is intended to support accelerated wallet checkout.</p></div><div class="quest-continue"><span class="tag">NOT READY TO BUY?</span><h2>CONTINUE YOUR QUEST</h2><p>Save your Build and unlock more of your RockGod character, personalised guidance and future Loadout updates.</p><div class="email-row"><input id="questemail" type="email" autocomplete="email" placeholder="Email address" aria-label="Email address"><button class="btn" id="questdemo">CONTINUE MY QUEST →</button></div><p class="prototype-note">Demo only — this prototype does not send or store your email. In the live version, saving your Build and optional marketing consent will be handled separately.</p><p id="questmsg" class="warning hidden">Quest route demonstrated. No email has been submitted or stored.</p></div>`}
 $('#content').innerHTML=html; updateNav();
 document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>selectAndStay(b.dataset.key,Number(b.dataset.val)));
 document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;setStage(1)});
 document.querySelectorAll('[data-nemesis]').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.nemesis); if(n===6){state.nemesis=state.nemesis.includes(6)?[]:[6]; render(true)} else {state.nemesis=state.nemesis.filter(v=>v!==6);toggleArray('nemesis',n,2)}});
 document.querySelectorAll('[data-barrier]').forEach(b=>b.onclick=()=>toggleArray('barriers',Number(b.dataset.barrier),2));
 if($('#restart'))$('#restart').onclick=()=>{Object.assign(state,{stage:0,mode:null,currentHair:null,currentBeard:null,targetHair:null,targetBeard:null,nemesis:[],barriers:[]});render(false)};
 if($('#buydemo'))$('#buydemo').onclick=()=>$('#buymsg').classList.remove('hidden');
 document.querySelectorAll('[data-wallet]').forEach(b=>b.onclick=()=>$('#buymsg').classList.remove('hidden'));
 if($('#questdemo'))$('#questdemo').onclick=()=>{const e=$('#questemail'); if(e && e.value && e.checkValidity()){$('#questmsg').classList.remove('hidden')} else if(e){e.reportValidity()}};
 if(preserve)requestAnimationFrame(()=>window.scrollTo({top:y,behavior:'instant'})); else window.scrollTo({top:0,behavior:'instant'});
}
$('#back').onclick=()=>{if(state.stage===8)setStage(7);else if(state.stage>0)setStage(state.stage-1)};
$('#next').onclick=()=>{if($('#next').disabled)return; if(state.stage===2&&state.mode==='keep'){state.targetHair=state.currentHair;state.targetBeard=state.currentBeard;setStage(4);return} if(state.stage===8){const b=$('#buydemo');if(b)b.click();return} setStage(state.stage+1)};
render(false);
</script>
