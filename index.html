<main class="wrap">
<header class="header"><div class="brand">RockGod®<small>BUILD THE LOOK · EQUIP THE ROUTINE</small></div><div class="alpha">ALPHA V0.6 · DEMO</div></header>
<section id="content" aria-live="polite"></section>
<footer class="foot">ROCKGOD® ALPHA V0.6 · TEST ONLY · NO PAYMENTS OR PERSONAL DATA COLLECTED</footer>
</main>
<div class="bottomnav" id="bottomnav"><div class="bottom-inner"><button class="btn" id="back">← BACK</button><div class="progress-wrap"><div id="step" class="step"></div><div id="progress" class="progress"></div></div><button class="btn gold" id="next">CONTINUE →</button></div></div>
<script>
'use strict';
const hair=['BALD / SHAVED','SHORT','MEDIUM','LONG'];
const beard=['CLEAN SHAVEN','STUBBLE','SHORT','LONG'];
const priorities={
 maintain:{label:'Nothing — just maintain my look',button:'NOTHING — JUST MAINTAIN MY LOOK'},
 flat:{label:'Hair looks flat',button:'HAIR LOOKS FLAT'},
 dry:{label:'Hair feels dry or rough',button:'HAIR FEELS DRY OR ROUGH'},
 fluffy:{label:'Hair looks messy or fluffy',button:'HAIR LOOKS MESSY OR FLUFFY'},
 style:{label:'Hair is difficult to style',button:'HAIR IS DIFFICULT TO STYLE'},
 beardRough:{label:'Beard feels rough',button:'BEARD FEELS ROUGH'},
 scalp:{label:'Care for my shaved head',button:'CARE FOR MY SHAVED HEAD'}
};
const barrierLabels=[
 'I don’t know what products to use',
 'I don’t know how to use them',
 'I’ve tried things and they haven’t worked',
 'I don’t want a complicated routine',
 'I don’t want to spend ages doing it',
 'I’m not sure what actually suits me'
];
const products={
 shampoo:{name:'RESET',type:'Shampoo',what:'A cleanser for your hair.',does:'Washes away dirt, oil and product residue.',how:'Apply to wet hair, massage gently and rinse. Follow the actual bottle directions.'},
 conditioner:{name:'RIFT',type:'Rinse-out conditioner',what:'A softening product used after shampoo.',does:'Helps hair feel softer and easier to manage.',how:'Apply after shampooing, then rinse as the bottle directs.'},
 leavein:{name:'ENCORE',type:'Leave-in conditioner',what:'A conditioner you do not rinse out.',does:'Adds an extra conditioning step after washing.',how:'Apply a small amount after washing, following the bottle directions.'},
 spray:{name:'AMP',type:'Hair texture spray',what:'A styling spray for experimenting with a slightly tousled look.',does:'Can help create a more textured finish; some formulas may add lift.',how:'Apply as directed, then use your fingers to shape your hair.'},
 clay:{name:'HOLDFAST',type:'Matte styling clay',what:'A styling product for shaping short hair.',does:'Helps shape a hairstyle with a less shiny finish.',how:'Rub a small amount between your hands and work through hair as directed.'},
 beardoil:{name:'BEARDFORGE',type:'Beard oil',what:'A conditioning oil for beard hair.',does:'Designed to help beard hair feel softer and more manageable.',how:'Apply the amount stated on the bottle and work through your beard.'},
 scalp:{name:'SCALPFORGE',type:'Proposed scalp-care balm',what:'A proposed moisturising product for a shaved head.',does:'Intended as scalp comfort care only, if a suitable formula is confirmed.',how:'Directions must be confirmed with the supplier before sale. This is not sun protection.'}
};
const state={stage:0,mode:null,currentHair:null,currentBeard:null,targetHair:null,targetBeard:null,priority:null,barriers:[]};
const $=s=>document.querySelector(s);
const asset=(type,i)=>`${type}-v0415-${i}.webp`;
const finalAsset=(h,b)=>`final-v0416-${h}-${b}.webp`;
const preloadCache=[];
function preloadPortraits(){
 const urls=[];
 for(let i=0;i<4;i++){urls.push(asset('hair',i),asset('beard',i));}
 for(let h=0;h<4;h++)for(let b=0;b<4;b++)urls.push(finalAsset(h,b));
 urls.forEach(src=>{const im=new Image();im.decoding='async';im.src=src;preloadCache.push(im);});
}
function prefetchSelectedFinal(){
 if(state.targetHair===null||state.targetBeard===null)return;
 const im=new Image();im.decoding='async';im.src=finalAsset(state.targetHair,state.targetBeard);preloadCache.push(im);
}
preloadPortraits();
function header(label,title,desc){return `<div class="eyebrow">${label}</div><h1>${title}</h1><p class="intro">${desc}</p>`}
function cards(type,key){const opts=type==='hair'?hair:beard;return `<div class="cards">${opts.map((v,i)=>`<button type="button" class="choice ${type} ${state[key]===i?'selected':''}" data-key="${key}" data-val="${i}" aria-pressed="${state[key]===i}"><img src="${asset(type,i)}" alt="${v.toLowerCase()} ${type} reference"><strong>${v}</strong><span>${state[key]===i?'SELECTED':'TAP TO SELECT'}</span></button>`).join('')}</div>`}
function allowedPriorities(){
 if(state.currentHair===0){return state.currentBeard>0?['beardRough','scalp','maintain']:['scalp','maintain'];}
 const a=['maintain','flat','dry','fluffy','style'];
 if(state.currentBeard>0)a.push('beardRough');
 return a;
}
function selectedName(){return priorities[state.priority]?.label||'Your chosen priority'}
function isGrowing(){return state.currentHair!==null&&state.targetHair>state.currentHair || state.currentBeard!==null&&state.targetBeard>state.currentBeard}
function companion(){return state.currentHair===3?'conditioner':'shampoo'}
function recommendation(){
 const h=state.currentHair,b=state.currentBeard,th=state.targetHair,tb=state.targetBeard,p=state.priority;
 let ids=[],headline='',intro='',why={},status='Prototype pairing: final formulas, mini availability and fulfilment economics still need supplier validation.';
 const changing=state.mode==='change'&&(h!==th||b!==tb);
 const growingHair=changing&&th>h;
 const hairNow=hair[h].toLowerCase().replace(' / ',' or ');
 const hairNext=hair[th].toLowerCase().replace(' / ',' or ');
 const beardNow=beard[b].toLowerCase();
 const beardNext=beard[tb].toLowerCase();
 const routeLine=changing
   ? `You're at ${hairNow} hair and a ${beardNow} beard today, building towards ${hairNext} hair and a ${beardNext} beard.`
   : `You're keeping the ${hairNow} hair and ${beardNow} beard you already like.`;

 if(h===0){
   ids=b>0?['beardoil','scalp']:['scalp'];
   headline=b>0?'Start with the Build you have — and the one you’re growing into.':'Start with simple scalp care.';
   intro=b>0
     ? `${routeLine} With a shaved head and a beard, your First Loadout focuses on useful gear for today while keeping your target Build in view.`
     : `${routeLine} A shaved head needs a different starting point from a hair-care routine, so this prototype keeps the first step deliberately simple.`;
   why.beardoil=p==='beardRough'
     ? 'Your top priority is how your beard feels, so beard oil is the main product to explore now.'
     : 'You have beard hair today, so this gives you a simple introduction to beard care while your Build develops.';
   why.scalp='You selected a shaved head, so scalp care replaces an irrelevant shampoo or styling product.';
   status='Scalp-care is a PROVISIONAL product role pending supplier confirmation of scalp suitability, mini size, directions and cost.';
 }else{
   if(p==='maintain'){
     if(growingHair && h>=2) ids=['conditioner','leavein'];
     else ids=['shampoo','conditioner'];
   }
   if(p==='flat'){
     ids=(h===3||(growingHair&&h>=2))?['conditioner','spray']:['shampoo','spray'];
   }
   if(p==='dry'){
     ids=h>=2?['conditioner','leavein']:['shampoo','conditioner'];

   if(p==='fluffy'){
     ids=(h>=2||growingHair)?['conditioner','leavein']:['shampoo','conditioner'];

   if(p==='style'){
     if(h===1 && th===1) ids=['shampoo','clay'];
     else if(h===1 && th>1) ids=['shampoo','conditioner'];

     else ids=['conditioner','leavein'];
   }
   if(p==='beardRough'){
     ids=(h>=2||growingHair)?['conditioner','beardoil']:['shampoo','beardoil'];
   }
   if(!ids.length)ids=['shampoo','conditioner'];

   const bridge = changing
     ? `${routeLine} This First Loadout is a bridge: products you can use now, chosen with your next stage in mind.`

   if(p==='maintain'){
     headline=changing?'Build the routine for your next stage.':'Keep your Build in shape.';

   if(p==='flat'){

   }
   if(p==='dry'){
     headline='Start with softer-feeling hair.';

   }
   if(p==='fluffy'){
     headline='Explore a more manageable routine.';
     intro=`${bridge} Hair that looks messy or fluffy can be frustrating when you don’t know where to start. This taster keeps the focus on care and manageability rather than throwing lots of styling products at you.`;
   }
   if(p==='style'){
     headline='Find your styling rhythm.';
     if(h===1&&th>1){
       intro=`${routeLine} Short hair growing towards ${hairNext} is entering a transition stage. Rather than lock you into a short-hair clay you may soon outgrow, your First Loadout starts with a simple wash-and-condition routine you can use as the length develops.`;
     }else if(h===1&&th===1){
       intro=`${bridge} Because you’re staying with short hair, this is the one route where a small clay sample makes sense as a simple styling experiment.`;
     }else if(h===2&&th===2){
       intro=`${bridge} Medium-length hair can be tricky to shape. This pair introduces a familiar wash step and a styling spray so you can experiment without needing to understand grooming jargon first.`;
     }else if(h===2&&th>2){
       intro=`${routeLine} Medium hair moving towards long hair needs a different kind of introduction from a short-hair styling routine. We start with conditioning and an after-wash product you can keep exploring as the length develops.`;
     }else if(h===3){
       intro=`${routeLine} Long hair can involve different styling challenges. We begin with conditioning and manageable preparation instead of throwing short-hair clay or multiple styling products at you.`;
     }else{
       intro=`${bridge} We’re recommending gear that is usable for the hair you have today without losing sight of the Build you’re moving towards.`;
     }
   }
   if(p==='beardRough'){
     headline='Give your beard some attention.';
     intro=`${bridge} Your beard is the priority, so beard oil is the specialist sample. The second mini gives you a useful hair-care step for the Build you have now and the direction you’re heading.`;
   }

   why.shampoo = growingHair
     ? 'A familiar cleansing step you can use now while your Build develops; it gives you a simple baseline before we add more specialist gear later.'

       ? 'A straightforward companion sample for your hair routine; it is not being presented as a beard treatment.'

   why.conditioner = growingHair
     ? 'As you move towards more length, this introduces the conditioning step early so you can learn how it fits into your developing routine.'
     : p==='dry'
       ? 'This is the main care sample for exploring whether a conditioning step feels useful for hair that currently feels dry or rough.'
       : p==='fluffy'
         ? 'This is the main care sample for exploring a more manageable routine before we add more styling gear.'
         : p==='beardRough'
           ? 'A separate hair-care sample chosen because the hair you have now can use it; it is not a beard treatment.'
           : 'A simple introduction to conditioning and how it fits alongside shampoo or an after-wash product.';
   why.leavein = growingHair
     ? 'This introduces an after-wash conditioning step that you can experiment with as your hair becomes longer.'
     : p==='style'
       ? 'This gives you an easy after-wash step to explore manageability before your later Quest gets into detailed styling goals.'
       : 'A second conditioning step to try after washing, so you can compare how your hair feels with and without it.';
   why.spray = p==='flat'
     ? 'This is your styling experiment: a spray designed to help you try a more textured look rather than hair simply sitting flat.'
     : 'This is an approachable styling experiment for your current length — something to try before we ask detailed styling questions later.';
   why.clay='Because you have short hair and are staying short, this is a suitable place to trial a small amount of shaping product. We do not use clay as the default long-hair recommendation.';
   why.beardoil='Your beard is the priority, so this is the specialist sample for exploring softness and manageability.';
 }
 const productList=ids.map(id=>({...products[id],id,why:why[id]||'A useful part of this introductory Bridge Loadout.'}));
 return {products:productList,headline,intro,status,exception:ids.length===1};

 if(s===1){html=header('CURRENT BUILD · HAIR','WHERE ARE YOU <em>NOW?</em>','Choose the hair that looks most like yours right now. Pick the closest.');html+=cards('hair','currentHair')}

 if(s===5){html=header('YOUR NEMESIS','WHAT’S YOUR <em>TOP PRIORITY?</em>','Choose the ONE thing you’d most like help with for your Build right now. Your Nemesis is just the next practical challenge.');html+=`<div class="nemesis">${allowedPriorities().map(id=>`<button type="button" data-priority="${id}" aria-pressed="${state.priority===id}" class="${state.priority===id?'selected':''}">${priorities[id].button}${state.priority===id?' ✓':''}</button>`).join('')}</div><p class="help-note">One priority keeps your First Loadout simple. More detailed questions can wait until your next Quest.</p>`}
 if(s===6){html=header('YOUR QUEST','WHAT’S BEEN <em>HOLDING YOU BACK?</em>','What would make this easier? Choose up to two reasons. These answers change your guidance, not the size of your kit.');html+=`<div class="barriers">${barrierLabels.map((p,i)=>`<button type="button" data-barrier="${i}" aria-pressed="${state.barriers.includes(i)}" class="${state.barriers.includes(i)?'selected':''}">${p}${state.barriers.includes(i)?' ✓':''}</button>`).join('')}</div><p class="help-note">We use this to tailor the explanation and Equip tips — not to push extra products.</p>`}
 if(s===7){const rec=recommendation();html=header('YOUR FIRST LOADOUT','BUILT FOR <em>YOUR NEXT STAGE.</em>','A Bridge Loadout: gear you can use now, chosen with the Build you’re working towards in mind.');html+=`<div class="panel quest">${finalVisual()}<div class="review"><div><strong>Current → Target</strong><p>${hair[state.currentHair]} → ${hair[state.targetHair]}<br>${beard[state.currentBeard]} → ${beard[state.targetBeard]}</p></div><div><strong>Your top priority</strong><p>${selectedName()}</p></div><div><strong>What’s holding you back</strong><p>${state.barriers.map(i=>barrierLabels[i]).join(' · ')}</p></div><div><strong>Our approach</strong><p>Bridge where you are now to the Build you’re working towards.</p></div></div><div class="journey">${journeyCopy()}</div><h2 class="copy-head">${rec.headline}</h2><p class="copy-intro">${rec.intro}</p>${productCards(rec)}<div class="guide"><h3>YOUR EQUIP GUIDE</h3><p>${guidance()}</p><p><strong>Your First Quest:</strong> Try the samples. See how your hair or beard looks and feels. Tell us what you think.</p></div><p class="prototype-note">${rec.status} Product names, directions and descriptions are draft illustrations; test actual formulations before sale.</p></div>`}
 if(s===8){const rec=recommendation();html=`<div class="completion-mark">✦</div>`+header('BUILD COMPLETE','YOUR FIRST BUILD IS <em>READY.</em>','Your First Loadout is an introduction to RockGod. Try the gear, learn what suits you and continue when you’re ready.');html+=`<div class="offer"><span class="tag">FIRST LOADOUT · CONCEPT OFFER</span><div class="offer-build"><img src="${finalAsset(state.targetHair,state.targetBeard)}" alt="Your target Build portrait"><span>${hair[state.targetHair]} HAIR · ${beard[state.targetBeard]} BEARD</span></div><h2>TRY YOUR FIRST LOADOUT</h2><div class="price">£9.95</div><p>${rec.products.length===1?'One focused scalp-care sample in this provisional shaved-head route.':'Two introductory mini products chosen to bridge where you are now and what you’re building towards.'}</p><div class="inline-offer-items">${rec.products.map(p=>`<span>${p.name} · ${p.type}</span>`).join('')}</div><div class="trust-strip"><div class="trust-item">Current → Target</div><div class="trust-item">Plain-English guide</div><div class="trust-item">No filler products</div><div class="trust-item">Try before full size</div></div><div class="journey" style="text-align:left">${journeyCopy()}</div><p class="prototype-note">£9.95 is an unconfirmed test price. No genuine previous price or limited-stock claim is made. Final samples, costs, postage and claims require validation. No live checkout.</p><button type="button" class="btn gold" id="buydemo">TRY MY FIRST LOADOUT · £9.95 →</button><div class="wallets"><button type="button" class="wallet dark" data-wallet="Apple Pay"> Pay · DEMO</button><button type="button" class="wallet" data-wallet="Google Pay">G Pay · DEMO</button><button type="button" class="wallet" data-wallet="Card">CARD · DEMO</button></div><p id="buymsg" class="status hidden" role="status">This is a purchase-intent demo, not a checkout. No payment was taken. Tell the tester whether you would buy it and why.</p><div class="addon"><h3>Complete your routine? · Optional</h3><label><input type="checkbox" id="bodywash"><span><strong>Body wash</strong> — a separate, future add-on for your shower routine. Not part of the £9.95 sample kit. Formula and price to be confirmed.</span></label><p id="addonmsg" class="small">No extra product is selected.</p></div></div><div class="corner-promise"><strong>NOT JUST IN YOUR BATHROOM CABINET.<br>WE’RE IN YOUR CORNER.</strong><p>Your Build will change. RockGod is being built to guide you with plain-English advice, evolving Loadouts and practical support as your Quest develops.</p></div><div class="quest-continue"><span class="tag">NOT READY TO BUY?</span><h2>CONTINUE YOUR QUEST</h2><p>You’re the main character. The next Quest will let you go deeper into your look, your routine and what you want to build next.</p><button type="button" class="btn" id="questdemo">Preview the Next Quest →</button><p id="questmsg" class="status hidden" role="status">Future feature preview: try your samples, tell us what worked, and optionally unlock a deeper character experience. No profile, email or personal information is collected here.</p><p class="prototype-note">In the eventual store, saving a Build and optional marketing permission will be separate choices. We are not promising an AI guide or proactive messages in this demo.</p></div><div class="test-panel"><h2>Testing this with a friend?</h2><p>Without explaining RockGod first, ask: Did the Build make sense? Did the samples feel relevant to both where you are now and where you’re heading? Could you understand what each product does? Would you tap the £9.95 button — and what stopped you?</p></div>`}
 $('#content').innerHTML=html;updateNav();
